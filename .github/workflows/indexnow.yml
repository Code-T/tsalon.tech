name: Notify IndexNow after production deployment

on:
  deployment_status:

permissions:
  contents: read

jobs:
  notify:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Submit changed canonical URLs
        working-directory: design-systems/01-protocol/prototype
        run: node scripts/indexnow-submit.mjs HEAD^ HEAD
